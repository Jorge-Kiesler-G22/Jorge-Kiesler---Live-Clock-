<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Clock </title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    :root {
      --accent: #b7d7c1;
      --bg: #101214;
      --fg: #f1f2ef;
      --muted: #858b8a;
      --panel: #1b1e20;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, sans-serif;
      transition: background 0.6s, color 0.6s;
    }

    body.light {
      --bg: #f1f0eb;
      --fg: #202323;
      --muted: #666d6b;
      --panel: #e2e4df;
    }

    .container {
      width: min(90%, 750px);
      padding: 45px;
      border: 1px solid #7774;
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 25px 90px #0003;
    }

    .header, .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .live {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 55px 0;
    }

    .greeting {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    #time {
      font-size: clamp(48px, 9vw, 88px);
      font-weight: 300;
      letter-spacing: -4px;
      font-variant-numeric: tabular-nums;
    }

    #seconds {
      color: var(--accent);
      font-size: 27px;
      margin-top: 10px;
    }

    #date {
      color: var(--muted);
      font-size: 13px;
      margin-top: 16px;
    }

    .circle {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      flex-shrink: 0;
      background: conic-gradient(
        var(--accent) 0%,
        var(--panel) 0%
      );
      transition: background 0.4s;
    }

    .circle::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: var(--panel);
    }

    .circle-content {
      position: relative;
      text-align: center;
    }

    #circleSeconds {
      font-size: 36px;
      font-weight: 300;
    }

    .circle-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-top: 5px;
    }

    .progress {
      height: 2px;
      background: #7774;
      overflow: hidden;
    }

    #progressFill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.4s;
    }

    .footer {
      margin-top: 25px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    button {
      background: transparent;
      color: var(--fg);
      border: 1px solid #7776;
      border-radius: 30px;
      padding: 9px 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    @media (max-width: 600px) {
      .container { padding: 25px; }
      .content {
        flex-direction: column;
        align-items: flex-start;
      }
      .circle { align-self: center; }
      .footer { flex-wrap: wrap; gap: 15px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">TIME / 001</div>
      <div class="live">● LIVE</div>
    </div>

    <div class="content">

      <div class="clock-info">
        <div class="greeting" id="greeting">
          GOOD MORNING
        </div>

        <div id="time">00:00</div>
        <div id="seconds">:00</div>
        <div id="date">LOADING DATE</div>
      </div>

      <div class="circle" id="circle">
        <div class="circle-content">
          <div id="circleSeconds">00</div>
          <div class="circle-label">SECONDS</div>
        </div>
      </div>

    </div>

    <div class="progress">
      <div id="progressFill"></div>
    </div>

    <div class="footer">
      <span id="timezone">LOCAL TIME</span>

      <div class="controls">
        <button id="formatBtn">12H / 24H</button>
        <button id="themeBtn">LIGHT / DARK</button>
      </div>
    </div>

  </div>

  <script>
    $(document).ready(function() {

      let use24Hour = false;

      function updateClock() {

        let now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        let displayHours = use24Hour
          ? hours
          : (hours % 12 || 12);

        let time =
          String(displayHours).padStart(2, "0")
          + ":"
          + String(minutes).padStart(2, "0");

        // Update clock text
        $("#time").text(time);
        $("#seconds").text(
          ":" + String(seconds).padStart(2, "0")
        );

        // Update date
        $("#date").text(
          now.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          }).toUpperCase()
        );

        // Animate seconds circle
        let percentage = (seconds / 60) * 100;

        $("#circleSeconds").text(
          String(seconds).padStart(2, "0")
        );

        $("#circle").css(
          "background",
          `conic-gradient(
            var(--accent) ${percentage}%,
            #7773 ${percentage}%
          )`
        );

        // Animate progress line
        $("#progressFill").css(
          "width", percentage + "%"
        );

        // Change colors based on time
        let color;
        let greeting;

        if (hours >= 5 && hours < 12) {
          color = "#b7d7c1";
          greeting = "GOOD MORNING";
        }
        else if (hours >= 12 && hours < 17) {
          color = "#e5c49b";
          greeting = "GOOD AFTERNOON";
        }
        else if (hours >= 17 && hours < 21) {
          color = "#d9a6a6";
          greeting = "GOOD EVENING";
        }
        else {
          color = "#aaa7df";
          greeting = "GOOD NIGHT";
        }

        document.documentElement.style
          .setProperty("--accent", color);

        $("#greeting").text(greeting);

        // Show local timezone
        $("#timezone").text(
          Intl.DateTimeFormat()
            .resolvedOptions()
            .timeZone
            .replaceAll("_", " ")
            .toUpperCase()
        );
      }

      // Switch 12 / 24 hour format
      $("#formatBtn").click(function() {
        use24Hour = !use24Hour;
        updateClock();
      });

      // Switch light / dark mode
      $("#themeBtn").click(function() {
        $("body").toggleClass("light");
      });

      // Update every second
      updateClock();
      setInterval(updateClock, 1000);

    });
  </script>

</body>
</html>
